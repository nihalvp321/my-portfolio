<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Slate Gallery Studio) -->
    <linearGradient id="evalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF1F5" />
      <stop offset="50%" stop-color="#DFE7ED" />
      <stop offset="100%" stop-color="#CCD9E2" />
    </linearGradient>

    <!-- Glowing Sheets -->
    <linearGradient id="sheetGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="100%" stop-color="rgba(230, 240, 250, 0.85)" />
    </linearGradient>
    <linearGradient id="sheetGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.85)" />
      <stop offset="100%" stop-color="rgba(29, 78, 216, 0.9)" />
    </linearGradient>
    <linearGradient id="sheetGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(20, 184, 166, 0.85)" />
      <stop offset="100%" stop-color="rgba(13, 148, 136, 0.9)" />
    </linearGradient>

    <!-- Pedestal Gradient -->
    <linearGradient id="pedestalEval" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D5DFE6" />
    </linearGradient>
    <linearGradient id="pedestalEvalSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B2C2CC" />
      <stop offset="100%" stop-color="#99ACB8" />
    </linearGradient>

    <filter id="softShadowEval" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E293B" flood-opacity="0.16" />
    </filter>
    <filter id="glowEval" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3B82F6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Gallery Wall Background -->
  <rect width="1200" height="675" fill="url(#evalBg)" />

  <!-- Ambient Light Center -->
  <circle cx="600" cy="240" r="340" fill="#FFFFFF" opacity="0.5" />

  <!-- Ground Shadow -->
  <ellipse cx="600" cy="540" rx="440" ry="38" fill="#1E293B" opacity="0.12" />

  <!-- Museum Pedestal (3D Stepped Slab) -->
  <g filter="url(#softShadowEval)">
    <polygon points="260,490 600,420 940,490 600,560" fill="url(#pedestalEval)" />
    <polygon points="260,490 600,560 600,600 260,530" fill="url(#pedestalEvalSide)" />
    <polygon points="600,560 940,490 940,530 600,600" fill="#889CA8" />
  </g>

  <!-- 3D Geometric Sculptural Installation: Layered Intelligent Evaluation Sheets -->
  <!-- Sheet 1 (Background - Cobalt Glass Tablet) -->
  <g transform="translate(420, 150) rotate(-12)" filter="url(#glowEval)">
    <rect width="180" height="240" rx="20" fill="url(#sheetGrad2)" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <!-- Symbolic NLP Text Lines -->
    <rect x="25" y="40" width="80" height="8" rx="4" fill="#FFFFFF" opacity="0.6" />
    <rect x="25" y="60" width="130" height="6" rx="3" fill="#FFFFFF" opacity="0.4" />
    <rect x="25" y="75" width="110" height="6" rx="3" fill="#FFFFFF" opacity="0.4" />
    <rect x="25" y="90" width="120" height="6" rx="3" fill="#FFFFFF" opacity="0.4" />
    <circle cx="140" cy="180" r="24" fill="#FFFFFF" opacity="0.2" />
  </g>

  <!-- Sheet 2 (Teal Semantic Matrix Tablet) -->
  <g transform="translate(620, 160) rotate(14)" filter="url(#glowEval)">
    <rect width="180" height="240" rx="20" fill="url(#sheetGrad3)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
    <rect x="25" y="40" width="70" height="8" rx="4" fill="#FFFFFF" opacity="0.7" />
    <rect x="25" y="60" width="130" height="6" rx="3" fill="#FFFFFF" opacity="0.4" />
    <rect x="25" y="75" width="100" height="6" rx="3" fill="#FFFFFF" opacity="0.4" />
    <rect x="25" y="90" width="120" height="6" rx="3" fill="#FFFFFF" opacity="0.4" />
    <!-- Checkmark Badge -->
    <circle cx="90" cy="165" r="28" fill="#FFFFFF" opacity="0.25" />
    <path d="M 80 165 L 87 172 L 102 157" stroke="#FFFFFF" stroke-width="3" fill="none" />
  </g>

  <!-- Sheet 3 (Center Front - Pristine White Ceramic/Glass Exam Evaluator) -->
  <g transform="translate(480, 190)" filter="url(#softShadowEval)">
    <rect width="240" height="300" rx="24" fill="url(#sheetGrad1)" stroke="rgba(255,255,255,0.9)" stroke-width="2" />
    
    <!-- Header of Paper -->
    <rect x="25" y="30" width="110" height="12" rx="6" fill="#1E293B" />
    <rect x="25" y="52" width="60" height="6" rx="3" fill="#64748B" />

    <!-- Evaluation Rubric Progress Bars -->
    <g transform="translate(25, 80)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#475569">CONCEPTUAL ACCURACY</text>
      <rect x="0" y="8" width="190" height="8" rx="4" fill="#E2E8F0" />
      <rect x="0" y="8" width="175" height="8" rx="4" fill="#3B82F6" />
    </g>

    <g transform="translate(25, 120)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#475569">SEMANTIC SIMILARITY</text>
      <rect x="0" y="8" width="190" height="8" rx="4" fill="#E2E8F0" />
      <rect x="0" y="8" width="182" height="8" rx="4" fill="#10B981" />
    </g>

    <g transform="translate(25, 160)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#475569">KEYWORD ALIGNMENT</text>
      <rect x="0" y="8" width="190" height="8" rx="4" fill="#E2E8F0" />
      <rect x="0" y="8" width="160" height="8" rx="4" fill="#6366F1" />
    </g>

    <!-- Score Badge Stamp -->
    <g transform="translate(130, 205)">
      <rect width="85" height="50" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
      <text x="42" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" letter-spacing="1" fill="#3B82F6">NLP SCORE</text>
      <text x="42" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#1E3A8A">96.5%</text>
    </g>
  </g>

  <!-- Orbiting 3D Spheres (Modern Museum Sculpture Detail) -->
  <circle cx="390" cy="420" r="28" fill="#F8FAFC" filter="url(#softShadowEval)" />
  <circle cx="390" cy="420" r="28" fill="#E2E8F0" opacity="0.3" />

  <circle cx="810" cy="380" r="22" fill="#3B82F6" opacity="0.9" filter="url(#glowEval)" />
  <circle cx="810" cy="380" r="22" fill="#93C5FD" opacity="0.3" />

  <!-- Modern Floating HUD Card (FastAPI + NLP Specs) -->
  <g transform="translate(160, 130)" filter="url(#softShadowEval)">
    <rect width="260" height="135" rx="20" fill="rgba(255,255,255,0.92)" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" />
    <circle cx="32" cy="35" r="10" fill="#3B82F6" />
    
    <text x="50" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#64748B">INTELLIGENT EVALUATION</text>
    <text x="50" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#0F172A">EvalAI ENGINE</text>
    
    <line x1="20" y1="62" x2="240" y2="62" stroke="#E2E8F0" stroke-width="1" />
    
    <text x="25" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#475569">Semantic Model</text>
    <text x="235" y="85" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1D4ED8">Transformers</text>

    <text x="25" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#475569">Database Layer</text>
    <text x="235" y="105" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0F172A">PostgreSQL</text>
  </g>

  <!-- Editorial Plaque on Right -->
  <g transform="translate(860, 480)" filter="url(#softShadowEval)">
    <rect width="180" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="20" y="28" font-family="'Bodoni Moda', serif" font-size="14" font-weight="700" fill="#0F172A">EvalAI</text>
    <text x="20" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#64748B">ANSWER SHEET EVALUATION</text>
    <text x="20" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#94A3B8">FastAPI • React • PostgreSQL</text>
  </g>
</svg>
