<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Gallery Studio) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECE9" />
      <stop offset="50%" stop-color="#DCE3DF" />
      <stop offset="100%" stop-color="#C9D6CE" />
    </linearGradient>

    <!-- Pedestal Gradient -->
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D5DBD7" />
    </linearGradient>
    <linearGradient id="pedestalSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8C4BC" />
      <stop offset="100%" stop-color="#9FAFA4" />
    </linearGradient>

    <!-- Glass Tower Gradients -->
    <linearGradient id="glass1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(110, 180, 185, 0.85)" />
      <stop offset="100%" stop-color="rgba(55, 125, 130, 0.95)" />
    </linearGradient>
    <linearGradient id="glass2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 240, 230, 0.9)" />
      <stop offset="100%" stop-color="rgba(215, 205, 190, 0.95)" />
    </linearGradient>
    <linearGradient id="glass3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(235, 120, 85, 0.85)" />
      <stop offset="100%" stop-color="rgba(195, 80, 50, 0.95)" />
    </linearGradient>

    <!-- Card Glassmorphism -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.92)" />
      <stop offset="100%" stop-color="rgba(245, 245, 245, 0.82)" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14261C" flood-opacity="0.15" />
    </filter>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Ambient Light Sphere in Background -->
  <circle cx="600" cy="240" r="340" fill="#FFFFFF" opacity="0.45" />

  <!-- Ground Shadow -->
  <ellipse cx="600" cy="540" rx="440" ry="40" fill="#182A20" opacity="0.12" />

  <!-- Museum Pedestal (3D Hexagonal / Rounded Slab) -->
  <g filter="url(#softShadow)">
    <!-- Top Face -->
    <polygon points="260,490 600,420 940,490 600,560" fill="url(#pedestalGrad)" />
    <!-- Left Face -->
    <polygon points="260,490 600,560 600,600 260,530" fill="url(#pedestalSide)" />
    <!-- Right Face -->
    <polygon points="600,560 940,490 940,530 600,600" fill="#8C9E93" />
  </g>

  <!-- Architectural 3D Glass Towers (Real Estate & AI Vector Architecture) -->
  <!-- Tower 1 (Left - Terracotta / Copper Warm Geometric Form) -->
  <g transform="translate(360, 240)">
    <!-- Shadow -->
    <ellipse cx="40" cy="220" rx="70" ry="20" fill="#14261C" opacity="0.2" />
    <!-- Left Facet -->
    <polygon points="0,60 50,30 50,220 0,250" fill="#D36B46" />
    <!-- Right Facet -->
    <polygon points="50,30 100,60 100,250 50,220" fill="#B35230" />
    <!-- Top Facet -->
    <polygon points="0,60 50,30 100,60 50,90" fill="#EA7D56" />
    <!-- Architectural grid lines -->
    <line x1="50" y1="90" x2="50" y2="220" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />
    <line x1="0" y1="120" x2="50" y2="150" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
    <line x1="0" y1="170" x2="50" y2="200" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
    <line x1="50" y1="150" x2="100" y2="120" stroke="#000000" stroke-opacity="0.15" stroke-width="1.5" />
  </g>

  <!-- Tower 2 (Center High - Emerald Teal Glass Tower) -->
  <g transform="translate(520, 110)">
    <!-- Shadow -->
    <ellipse cx="80" cy="350" rx="90" ry="25" fill="#14261C" opacity="0.25" />
    <!-- Left Facet -->
    <polygon points="0,60 80,10 80,350 0,400" fill="url(#glass1)" />
    <!-- Right Facet -->
    <polygon points="80,10 160,60 160,400 80,350" fill="#2E696E" />
    <!-- Top Roof -->
    <polygon points="0,60 80,10 160,60 80,110" fill="#8AD2D7" />
    <!-- Modern Glass Paneling -->
    <line x1="80" y1="110" x2="80" y2="350" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" />
    <line x1="0" y1="150" x2="80" y2="200" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="0" y1="220" x2="80" y2="270" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="0" y1="290" x2="80" y2="340" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="80" y1="200" x2="160" y2="150" stroke="#000000" stroke-opacity="0.2" stroke-width="1.5" />
    <line x1="80" y1="270" x2="160" y2="220" stroke="#000000" stroke-opacity="0.2" stroke-width="1.5" />
  </g>

  <!-- Tower 3 (Right - Sandstone Cylinder & Spire) -->
  <g transform="translate(710, 200)">
    <!-- Left Facet -->
    <polygon points="0,50 60,20 60,260 0,290" fill="#D8CFBD" />
    <!-- Right Facet -->
    <polygon points="60,20 120,50 120,290 60,260" fill="#BDB39E" />
    <!-- Top Cap -->
    <polygon points="0,50 60,20 120,50 60,80" fill="#EAE3D5" />
  </g>

  <!-- RAG Vector Retrieval Mesh & Orbiting Nodes -->
  <g stroke="#3D7A7F" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.65">
    <path d="M 380,320 Q 560,180 600,280 T 820,340" />
    <path d="M 440,380 Q 600,430 760,330" />
  </g>

  <!-- Vector Nodes (Glowing Points) -->
  <circle cx="380" cy="320" r="7" fill="#D36B46" />
  <circle cx="380" cy="320" r="14" fill="#D36B46" opacity="0.25" />

  <circle cx="600" cy="280" r="9" fill="#2E696E" />
  <circle cx="600" cy="280" r="18" fill="#5DB5BB" opacity="0.35" />

  <circle cx="820" cy="340" r="6" fill="#D8CFBD" />
  <circle cx="820" cy="340" r="13" fill="#D8CFBD" opacity="0.3" />

  <circle cx="760" cy="330" r="8" fill="#E26338" />

  <!-- Floating Modern Glassmorphic HUD Badge (EKARBOT AI Specs) -->
  <g transform="translate(180, 120)" filter="url(#cardGlow)">
    <rect width="280" height="150" rx="20" fill="url(#cardBg)" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" />
    <circle cx="35" cy="38" r="12" fill="#D36B46" />
    <path d="M 31 38 L 35 42 L 41 34" stroke="#FFFFFF" stroke-width="2" fill="none" />
    
    <text x="56" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#6B7280">RAG ARCHITECTURE</text>
    <text x="56" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#111827">EKARBOT SYSTEM</text>
    
    <line x1="20" y1="68" x2="260" y2="68" stroke="#E5E7EB" stroke-width="1" />
    
    <text x="25" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#4B5563">Vector Embeddings</text>
    <text x="255" y="92" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#047857">1536-dim</text>
    
    <text x="25" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#4B5563">Property Match Rate</text>
    <text x="255" y="112" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#047857">98.4%</text>

    <text x="25" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#4B5563">Pipeline Host</text>
    <text x="255" y="132" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#1F2937">AWS EC2</text>
  </g>

  <!-- Editorial Plaque on Pedestal -->
  <g transform="translate(860, 480)" filter="url(#cardGlow)">
    <rect width="180" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <text x="20" y="28" font-family="'Bodoni Moda', serif" font-size="14" font-weight="700" fill="#111827">EKARBOT</text>
    <text x="20" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#6B7280">AI REAL ESTATE ASSISTANT</text>
    <text x="20" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#9CA3AF">TypeScript • OpenAI • RAG</text>
  </g>
</svg>
