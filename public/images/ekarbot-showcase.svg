<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Muted Studio Sage) -->
    <linearGradient id="bgSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8DC" />
      <stop offset="50%" stop-color="#D9E2D2" />
      <stop offset="100%" stop-color="#CFD9C7" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Monitor Drop Shadow -->
    <filter id="monitorShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#1B261D" flood-opacity="0.24" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1B261D" flood-opacity="0.14" />
    </filter>

    <!-- Stand Drop Shadow -->
    <filter id="standShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1A241C" flood-opacity="0.25" />
    </filter>

    <!-- Metallic Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A403A" />
      <stop offset="50%" stop-color="#242924" />
      <stop offset="100%" stop-color="#181B18" />
    </linearGradient>

    <!-- Stand Metallic Gradient -->
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C544C" />
      <stop offset="100%" stop-color="#2C322C" />
    </linearGradient>

    <!-- Luxury Real Estate Card Gradient -->
    <linearGradient id="propCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glass Highlight -->
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="url(#bgSage)" />
  <rect width="1200" height="750" fill="url(#centerGlow)" />

  <!-- Subtle Concentric Architectural Circles -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2">
    <circle cx="600" cy="385" r="150" />
    <circle cx="600" cy="385" r="260" />
    <circle cx="600" cy="385" r="380" />
    <circle cx="600" cy="385" r="510" />
    <circle cx="600" cy="385" r="660" stroke-opacity="0.25" />
    <circle cx="600" cy="385" r="820" stroke-opacity="0.12" />
  </g>

  <!-- Top-Left Monospace Tag -->
  <text x="50" y="62" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#697764" letter-spacing="2.5">01 / GENERATIVE AI &amp; RAG</text>

  <!-- Bottom-Right Circular Action Button -->
  <g filter="url(#btnShadow)">
    <circle cx="1140" cy="690" r="28" fill="#FFFFFF" />
    <path d="M1133 697 L1147 683 M1137 683 L1147 683 L1147 693" stroke="#232822" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== DESKTOP MONITOR MOCKUP ==================== -->
  <g transform="translate(600, 375)">
    <!-- Stand Base and Neck Shadow -->
    <ellipse cx="0" cy="275" rx="140" ry="20" fill="#152017" opacity="0.25" filter="url(#standShadow)" />

    <!-- Stand Neck -->
    <path d="M-22 170 L22 170 L18 265 L-18 265 Z" fill="url(#standGrad)" />

    <!-- Stand Minimalist Base -->
    <path d="M-90 268 C-90 264, -80 262, 0 262 C80 262, 90 264, 90 268 L82 278 C82 282, 70 284, 0 284 C-70 284, -82 282, -82 278 Z" fill="#282E28" stroke="#3E473E" stroke-width="1" />

    <!-- Monitor Outer Body (Bezel) -->
    <rect x="-420" y="-240" width="840" height="480" rx="20" fill="url(#frameGrad)" stroke="#4A544A" stroke-width="2" filter="url(#monitorShadow)" />

    <!-- Display Screen -->
    <rect x="-408" y="-228" width="816" height="456" rx="12" fill="#0B0F17" />

    <!-- ================= Web App UI (EKARBOT Dashboard) ================= -->
    <g transform="translate(-408, -228)">
      <!-- Top Browser / Navigation Bar -->
      <rect x="0" y="0" width="816" height="42" fill="#111827" />
      <circle cx="20" cy="21" r="5" fill="#EF4444" />
      <circle cx="36" cy="21" r="5" fill="#F59E0B" />
      <circle cx="52" cy="21" r="5" fill="#10B981" />

      <!-- Platform Title -->
      <text x="80" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#F9FAFB" letter-spacing="1">EKARBOT</text>
      <rect x="150" y="11" width="130" height="20" rx="10" fill="#1F2937" />
      <circle cx="162" cy="21" r="3.5" fill="#10B981" />
      <text x="172" y="25" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#9CA3AF">RAG Vector v2.4</text>

      <!-- URL / Search Bar in Header -->
      <rect x="300" y="8" width="370" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="320" y="25" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">🔍 "Find 3-bed waterfront apartment in Dubai Marina with >8% ROI"</text>

      <rect x="710" y="10" width="86" height="22" rx="11" fill="url(#goldAccent)" />
      <text x="753" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#000000">AI AGENT ON</text>

      <!-- Main Web Dashboard Content Area -->
      <!-- Left Column: Property Visual & Match Card -->
      <g transform="translate(18, 54)">
        <rect x="0" y="0" width="380" height="388" rx="14" fill="#151C2A" stroke="#1E293B" stroke-width="1" />

        <!-- Property Hero Image Preview Container -->
        <rect x="12" y="12" width="356" height="180" rx="10" fill="#1E293B" />
        <!-- Stylized 3D architectural illustration / villa render -->
        <path d="M40 160 L140 70 L280 70 L340 160 Z" fill="#293548" />
        <path d="M140 70 L280 70 L280 160 L140 160 Z" fill="#3B4C66" />
        <rect x="170" y="90" width="80" height="70" fill="#60A5FA" opacity="0.3" />
        <line x1="210" y1="90" x2="210" y2="160" stroke="#93C5FD" stroke-width="1" />
        <line x1="170" y1="125" x2="250" y2="125" stroke="#93C5FD" stroke-width="1" />

        <!-- Floating Tag on image -->
        <rect x="22" y="22" width="115" height="22" rx="11" fill="rgba(15, 23, 42, 0.85)" stroke="#38BDF8" stroke-width="1" />
        <text x="79" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38BDF8">✨ 98.4% RAG MATCH</text>

        <!-- Property Details -->
        <text x="14" y="218" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Marina Vista Sky Penthouse</text>
        <text x="14" y="236" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Dubai Marina, UAE • Bayut Verified Listing</text>

        <text x="14" y="272" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#F59E0B">AED 2,450,000</text>
        <text x="145" y="272" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">● 8.4% Projected Yield</text>

        <!-- Features pill row -->
        <g transform="translate(14, 290)">
          <rect x="0" y="0" width="75" height="24" rx="6" fill="#1E293B" />
          <text x="37" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#E2E8F0">3 Bedrooms</text>

          <rect x="85" y="0" width="75" height="24" rx="6" fill="#1E293B" />
          <text x="122" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#E2E8F0">4 Bathrooms</text>

          <rect x="170" y="0" width="85" height="24" rx="6" fill="#1E293B" />
          <text x="212" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#E2E8F0">2,850 sq.ft</text>

          <rect x="265" y="0" width="85" height="24" rx="6" fill="#1E293B" />
          <text x="307" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#E2E8F0">Sea View</text>
        </g>

        <!-- Pipeline Sync Badge -->
        <g transform="translate(14, 335)">
          <rect x="0" y="0" width="352" height="38" rx="8" fill="#1E293B" />
          <circle cx="20" cy="19" r="6" fill="#10B981" />
          <text x="35" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#F1F5F9">CRM &amp; Vector Embeddings Synced</text>
          <text x="35" y="30" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#64748B">Supabase pgvector • OpenAI text-embedding-3 • AWS EC2</text>
        </g>
      </g>

      <!-- Right Column: Interactive AI RAG Copilot & Analytics -->
      <g transform="translate(416, 54)">
        <rect x="0" y="0" width="382" height="388" rx="14" fill="#151C2A" stroke="#1E293B" stroke-width="1" />

        <!-- Chat Header -->
        <rect x="0" y="0" width="382" height="42" rx="14" fill="#1E293B" />
        <circle cx="24" cy="21" r="8" fill="#F59E0B" />
        <text x="24" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#000000">E</text>
        <text x="42" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">EKARBOT Intelligence Copilot</text>
        <rect x="290" y="11" width="76" height="20" rx="10" fill="#10B981" opacity="0.2" />
        <text x="328" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34D399">Active n8n</text>

        <!-- Message 1: User Request -->
        <g transform="translate(14, 56)">
          <rect x="70" y="0" width="284" height="46" rx="10" fill="#334155" />
          <text x="82" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#F8FAFC">"Find premium property options in Dubai</text>
          <text x="82" y="32" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#F8FAFC">Marina yielding above 8% rental return."</text>
        </g>

        <!-- Message 2: EKARBOT AI Response -->
        <g transform="translate(14, 114)">
          <rect x="0" y="0" width="354" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <circle cx="16" cy="18" r="6" fill="#F59E0B" />
          <text x="30" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#F59E0B">EKARBOT Assistant</text>
          <text x="14" y="42" font-family="system-ui, sans-serif" font-size="9" font-weight="400" fill="#E2E8F0">Identified 3 top properties from Bayut &amp; internal</text>
          <text x="14" y="56" font-family="system-ui, sans-serif" font-size="9" font-weight="400" fill="#E2E8F0">CRM with high capital appreciation potential:</text>

          <text x="14" y="76" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38BDF8">1. Marina Vista Sky (AED 2.45M • 8.4% yield)</text>
          <text x="14" y="92" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94A3B8">2. Silverene Towers (AED 2.10M • 8.1% yield)</text>
          <text x="14" y="108" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94A3B8">3. Damac Heights (AED 2.65M • 8.3% yield)</text>
        </g>

        <!-- Semantic Retrieval Metrics Card -->
        <g transform="translate(14, 248)">
          <rect x="0" y="0" width="354" height="66" rx="10" fill="#0B132B" stroke="#1C2541" stroke-width="1" />
          <text x="14" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38BDF8" letter-spacing="1">SEMANTIC RETRIEVAL PERFORMANCE</text>
          <!-- Metric 1 -->
          <text x="14" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">+40%</text>
          <text x="14" y="56" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#64748B">Matching Accuracy</text>
          <!-- Metric 2 -->
          <text x="130" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#10B981">&lt;350ms</text>
          <text x="130" y="56" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#64748B">Query Latency</text>
          <!-- Metric 3 -->
          <text x="240" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#F59E0B">Zero Manual</text>
          <text x="240" y="56" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#64748B">Pipeline Sync</text>
        </g>

        <!-- Prompt input footer -->
        <g transform="translate(14, 328)">
          <rect x="0" y="0" width="354" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="16" y="25" font-family="system-ui, sans-serif" font-size="9" font-weight="400" fill="#64748B">Ask EKARBOT anything about listings, ROI or legal terms...</text>
          <rect x="306" y="8" width="38" height="26" rx="6" fill="#F59E0B" />
          <path d="M322 17 L328 21 L322 25" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        </g>
      </g>
    </g>

    <!-- Glass Reflection Highlight across monitor -->
    <path d="M-408 -228 L-180 -228 L-408 120 Z" fill="url(#screenGlass)" pointer-events="none" />
  </g>
</svg>
