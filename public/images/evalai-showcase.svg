<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Muted Studio Sage) -->
    <linearGradient id="bgSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8DC" />
      <stop offset="50%" stop-color="#D9E2D2" />
      <stop offset="100%" stop-color="#CFD9C7" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Monitor Drop Shadow -->
    <filter id="monitorShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#1B261D" flood-opacity="0.24" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1B261D" flood-opacity="0.14" />
    </filter>

    <filter id="standShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1A241C" flood-opacity="0.25" />
    </filter>

    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A403A" />
      <stop offset="50%" stop-color="#242924" />
      <stop offset="100%" stop-color="#181B18" />
    </linearGradient>

    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C544C" />
      <stop offset="100%" stop-color="#2C322C" />
    </linearGradient>

    <linearGradient id="indigoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="url(#bgSage)" />
  <rect width="1200" height="750" fill="url(#centerGlow)" />

  <!-- Subtle Concentric Architectural Circles -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2">
    <circle cx="600" cy="385" r="150" />
    <circle cx="600" cy="385" r="260" />
    <circle cx="600" cy="385" r="380" />
    <circle cx="600" cy="385" r="510" />
    <circle cx="600" cy="385" r="660" stroke-opacity="0.25" />
    <circle cx="600" cy="385" r="820" stroke-opacity="0.12" />
  </g>

  <!-- Top-Left Monospace Tag -->
  <text x="50" y="62" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#697764" letter-spacing="2.5">05 / NLP &amp; EXAM EVALUATION</text>

  <!-- Bottom-Right Circular Action Button -->
  <g filter="url(#btnShadow)">
    <circle cx="1140" cy="690" r="28" fill="#FFFFFF" />
    <path d="M1133 697 L1147 683 M1137 683 L1147 683 L1147 693" stroke="#232822" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== DESKTOP MONITOR MOCKUP ==================== -->
  <g transform="translate(600, 375)">
    <!-- Stand Base and Neck Shadow -->
    <ellipse cx="0" cy="275" rx="140" ry="20" fill="#152017" opacity="0.25" filter="url(#standShadow)" />

    <!-- Stand Neck -->
    <path d="M-22 170 L22 170 L18 265 L-18 265 Z" fill="url(#standGrad)" />

    <!-- Stand Minimalist Base -->
    <path d="M-90 268 C-90 264, -80 262, 0 262 C80 262, 90 264, 90 268 L82 278 C82 282, 70 284, 0 284 C-70 284, -82 282, -82 278 Z" fill="#282E28" stroke="#3E473E" stroke-width="1" />

    <!-- Monitor Outer Body (Bezel) -->
    <rect x="-420" y="-240" width="840" height="480" rx="20" fill="url(#frameGrad)" stroke="#4A544A" stroke-width="2" filter="url(#monitorShadow)" />

    <!-- Display Screen -->
    <rect x="-408" y="-228" width="816" height="456" rx="12" fill="#0B101D" />

    <!-- ================= Web App UI (EvalAI Assessment Suite) ================= -->
    <g transform="translate(-408, -228)">
      <!-- Top Browser Bar -->
      <rect x="0" y="0" width="816" height="42" fill="#111827" />
      <circle cx="20" cy="21" r="5" fill="#EF4444" />
      <circle cx="36" cy="21" r="5" fill="#F59E0B" />
      <circle cx="52" cy="21" r="5" fill="#10B981" />

      <!-- Brand -->
      <text x="80" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#818CF8" letter-spacing="1">EVAL<tspan fill="#FFFFFF">AI</tspan></text>
      <rect x="150" y="11" width="135" height="20" rx="10" fill="#1E293B" />
      <circle cx="162" cy="21" r="3.5" fill="#10B981" />
      <text x="174" y="25" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#94A3B8">NLP Semantic Engine</text>

      <!-- Exam Title in Top Bar -->
      <rect x="310" y="8" width="310" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="330" y="25" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#CBD5E1">📄 CS-402: Distributed Systems Final Exam (Paper #184)</text>

      <rect x="670" y="10" width="130" height="22" rx="11" fill="url(#indigoAccent)" />
      <text x="735" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">AUTO-GRADED (A+)</text>

      <!-- Split Layout: Left Paper Evaluation (390px) + Right Semantic Analysis (390px) -->
      <!-- Left Column: Student Answer Sheet Document Preview -->
      <g transform="translate(18, 54)">
        <rect x="0" y="0" width="375" height="388" rx="14" fill="#151C2C" stroke="#1E293B" stroke-width="1" />

        <!-- Header -->
        <rect x="12" y="12" width="351" height="34" rx="8" fill="#1E293B" />
        <text x="24" y="32" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Student Answer Script • OCR &amp; Semantic Parsed</text>

        <!-- Simulated Answer Sheet Page -->
        <g transform="translate(12, 54)">
          <rect x="0" y="0" width="351" height="322" rx="10" fill="#F8FAFC" />
          
          <!-- Question Box -->
          <rect x="14" y="14" width="323" height="36" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
          <text x="22" y="30" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#0F172A">Q3: Explain Paxos consensus &amp; quorum consistency.</text>

          <!-- Student Answer Paragraphs with Highlighted NLP Tokens -->
          <g transform="translate(14, 60)">
            <text x="6" y="18" font-family="'Merriweather', Georgia, serif" font-size="9.5" fill="#1E293B">The Paxos consensus algorithm establishes state machine</text>
            
            <!-- Highlight Box 1 (Green: High Semantic Match) -->
            <rect x="4" y="26" width="220" height="18" rx="3" fill="#DEF7EC" stroke="#31C48D" stroke-width="1" />
            <text x="8" y="39" font-family="'Merriweather', Georgia, serif" font-size="9.5" font-weight="700" fill="#03543F">replication over an asynchronous network.</text>
            <text x="230" y="39" font-family="'Merriweather', Georgia, serif" font-size="9.5" fill="#1E293B">A leader node</text>

            <text x="6" y="58" font-family="'Merriweather', Georgia, serif" font-size="9.5" fill="#1E293B">broadcasts proposals across three distinct phases:</text>

            <!-- Highlight Box 2 (Blue: Exact Keyword Match) -->
            <rect x="4" y="66" width="310" height="18" rx="3" fill="#E1EFFE" stroke="#76A9FA" stroke-width="1" />
            <text x="8" y="79" font-family="'Merriweather', Georgia, serif" font-size="9.5" font-weight="700" fill="#1E429F">Phase 1 (Prepare/Promise), Phase 2 (Accept), Phase 3 (Commit).</text>

            <text x="6" y="104" font-family="'Merriweather', Georgia, serif" font-size="9.5" fill="#1E293B">Quorum requirements dictate that any majority</text>
            
            <!-- Highlight Box 3 (Purple: Conceptual Equivalence) -->
            <rect x="4" y="112" width="260" height="18" rx="3" fill="#EDEBFE" stroke="#AC94FA" stroke-width="1" />
            <text x="8" y="125" font-family="'Merriweather', Georgia, serif" font-size="9.5" font-weight="700" fill="#5521B5">Q >= floor(N/2) + 1 guarantees safety invariants,</text>

            <text x="6" y="148" font-family="'Merriweather', Georgia, serif" font-size="9.5" fill="#1E293B">preventing split-brain even during partition faults.</text>
          </g>

          <!-- NLP Confidence Callout Badge -->
          <g transform="translate(14, 240)">
            <rect x="0" y="0" width="323" height="68" rx="8" fill="#0F172A" />
            <circle cx="20" cy="20" r="8" fill="#10B981" />
            <text x="20" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF">✓</text>
            <text x="36" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#F8FAFC">Semantic Cosine Similarity: 0.968</text>
            <text x="14" y="44" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#94A3B8">Matches teacher benchmark key in phrasing and conceptual depth.</text>
            <text x="14" y="58" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#38BDF8">FastAPI Backend • PyTorch SentenceTransformers</text>
          </g>
        </g>
      </g>

      <!-- Right Column: NLP Grading Analytics & Teacher Feedback -->
      <g transform="translate(411, 54)">
        <rect x="0" y="0" width="387" height="388" rx="14" fill="#151C2C" stroke="#1E293B" stroke-width="1" />

        <!-- Score Dial Card -->
        <g transform="translate(14, 14)">
          <rect x="0" y="0" width="359" height="116" rx="12" fill="#1E293B" />
          
          <!-- Circular Dial -->
          <g transform="translate(60, 58)">
            <circle cx="0" cy="0" r="42" fill="none" stroke="#334155" stroke-width="8" />
            <circle cx="0" cy="0" r="42" fill="none" stroke="#6366F1" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="18" stroke-linecap="round" transform="rotate(-90)" />
            <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">94</text>
            <text x="0" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#A5B4FC">/ 100</text>
          </g>

          <g transform="translate(130, 24)">
            <text x="0" y="16" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Excellent Formulation</text>
            <text x="0" y="34" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#10B981">● Conceptual Depth: 9.6 / 10</text>
            <text x="0" y="48" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#38BDF8">● Keyword Precision: 94%</text>
            <text x="0" y="62" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#C084FC">● Semantic Similarity: 96.8%</text>
            <text x="0" y="76" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#94A3B8">Model: sentence-transformers/all-MiniLM-L6-v2</text>
          </g>
        </g>

        <!-- NLP Rubric Criteria Breakdown -->
        <g transform="translate(14, 142)">
          <rect x="0" y="0" width="359" height="114" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
          <text x="14" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">RUBRIC EVALUATION CRITERIA</text>

          <!-- Criterion 1 -->
          <g transform="translate(14, 34)">
            <text x="0" y="12" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#CBD5E1">Phase Definitions (Prepare/Accept/Commit)</text>
            <text x="290" y="12" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#10B981">10 / 10</text>
            <rect x="0" y="18" width="330" height="4" rx="2" fill="#334155" />
            <rect x="0" y="18" width="330" height="4" rx="2" fill="#10B981" />
          </g>

          <!-- Criterion 2 -->
          <g transform="translate(14, 62)">
            <text x="0" y="12" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#CBD5E1">Quorum Majority Formula Proof</text>
            <text x="290" y="12" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#6366F1">9.5 / 10</text>
            <rect x="0" y="18" width="330" height="4" rx="2" fill="#334155" />
            <rect x="0" y="18" width="313" height="4" rx="2" fill="#6366F1" />
          </g>

          <!-- Criterion 3 -->
          <g transform="translate(14, 90)">
            <text x="0" y="12" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#CBD5E1">Split-brain &amp; Safety Invariant Analysis</text>
            <text x="290" y="12" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#38BDF8">9.0 / 10</text>
            <rect x="0" y="18" width="330" height="4" rx="2" fill="#334155" />
            <rect x="0" y="18" width="297" height="4" rx="2" fill="#38BDF8" />
          </g>
        </g>

        <!-- Automated Teacher Feedback / Action Button -->
        <g transform="translate(14, 268)">
          <rect x="0" y="0" width="359" height="106" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1" />
          <text x="12" y="20" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#818CF8">AI TEACHER REMARKS (AUTO-GENERATED)</text>
          <text x="12" y="38" font-family="system-ui, sans-serif" font-size="8" font-weight="400" fill="#E2E8F0">"Well-structured explanation covering all core consensus steps.</text>
          <text x="12" y="52" font-family="system-ui, sans-serif" font-size="8" font-weight="400" fill="#E2E8F0">Accurately captured quorum invariants without conceptual gaps."</text>

          <rect x="12" y="66" width="335" height="30" rx="6" fill="#4F46E5" />
          <text x="179" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Approve Grade &amp; Sync to Gradebook</text>
        </g>
      </g>
    </g>

    <!-- Glass Reflection Highlight across monitor -->
    <path d="M-408 -228 L-180 -228 L-408 120 Z" fill="url(#screenGlass)" pointer-events="none" />
  </g>
</svg>
