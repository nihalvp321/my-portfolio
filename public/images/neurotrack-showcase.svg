<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Muted Studio Sage) -->
    <linearGradient id="bgSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8DC" />
      <stop offset="50%" stop-color="#D9E2D2" />
      <stop offset="100%" stop-color="#CFD9C7" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Phone 3D Shadow -->
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="-10" dy="28" stdDeviation="24" flood-color="#1E281F" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E281F" flood-opacity="0.14" />
    </filter>

    <!-- Phone Glass Gloss -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Titanium Phone Bezel -->
    <linearGradient id="titaniumFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#404642" />
      <stop offset="50%" stop-color="#242825" />
      <stop offset="100%" stop-color="#171917" />
    </linearGradient>

    <!-- Coral Action Button -->
    <linearGradient id="coralBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EB3333" />
      <stop offset="100%" stop-color="#F24B4B" />
    </linearGradient>

    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Button Drop Shadow -->
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="url(#bgSage)" />
  <rect width="1200" height="750" fill="url(#centerGlow)" />

  <!-- Subtle Concentric Architectural Circles -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.2">
    <circle cx="600" cy="385" r="140" />
    <circle cx="600" cy="385" r="240" />
    <circle cx="600" cy="385" r="350" />
    <circle cx="600" cy="385" r="470" />
    <circle cx="600" cy="385" r="600" stroke-opacity="0.25" />
    <circle cx="600" cy="385" r="740" stroke-opacity="0.15" />
  </g>

  <!-- Top-Left Monospace Tag -->
  <text x="50" y="62" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#697764" letter-spacing="2.5">04 / HEALTHCARE AI &amp; ML SYSTEM</text>

  <!-- Bottom-Right Circular Action Button -->
  <g filter="url(#btnShadow)">
    <circle cx="1140" cy="690" r="28" fill="#FFFFFF" />
    <path d="M1133 697 L1147 683 M1137 683 L1147 683 L1147 693" stroke="#232822" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== LEFT PHONE (Tilted -6 deg) ==================== -->
  <g transform="translate(440, 390) rotate(-6)">
    <!-- Ambient Shadow -->
    <rect x="-142" y="-285" width="284" height="570" rx="46" fill="#000000" filter="url(#phoneShadow)" />

    <!-- Outer Titanium Chassis -->
    <rect x="-140" y="-282" width="280" height="564" rx="44" fill="url(#titaniumFrame)" stroke="#535B54" stroke-width="2" />

    <!-- Screen Bezel -->
    <rect x="-132" y="-274" width="264" height="548" rx="36" fill="#0A0D0B" />

    <!-- Screen Content (Light Clean UI) -->
    <rect x="-130" y="-272" width="260" height="544" rx="34" fill="#F8F9FA" />

    <!-- Top Status Bar -->
    <text x="-95" y="-246" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1A1C1A">9:41</text>
    <!-- Dynamic Island -->
    <rect x="-42" y="-260" width="84" height="22" rx="11" fill="#000000" />
    <circle cx="24" cy="-249" r="4" fill="#1C1E24" />

    <!-- App Top Bar -->
    <text x="-105" y="-216" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A" letter-spacing="0.5">NEUROTRACK</text>
    <rect x="75" y="-226" width="30" height="14" rx="7" fill="#E2E8F0" />
    <circle cx="82" cy="-219" r="3" fill="#10B981" />

    <!-- 4 Assessment Grid Cards (as in user reference image!) -->
    <g transform="translate(0, -188)">
      <!-- Card 1: Gait Analysis -->
      <rect x="-105" y="0" width="98" height="74" rx="14" fill="url(#cyanCard)" />
      <!-- Minimalist Icon / Graphic -->
      <path d="M-62 25 C-58 18, -50 20, -48 28 C-46 34, -42 42, -38 48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="-56" cy="18" r="4" fill="#FFFFFF" />
      <text x="-96" y="60" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Gait Sensor</text>

      <!-- Card 2: Voice Test -->
      <rect x="7" y="0" width="98" height="74" rx="14" fill="url(#amberCard)" />
      <!-- Soundwave -->
      <line x1="40" y1="26" x2="40" y2="44" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="48" y1="18" x2="48" y2="52" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="56" y1="22" x2="56" y2="48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="64" y1="30" x2="64" y2="40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <text x="16" y="60" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Voice Acoustic</text>

      <!-- Card 3: Tremor Tracking -->
      <rect x="-105" y="84" width="98" height="74" rx="14" fill="url(#purpleCard)" />
      <path d="M-75 120 L-65 110 L-55 130 L-45 105 L-35 125 L-25 118" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="-96" y="144" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Tremor Motion</text>

      <!-- Card 4: Spiral Drawing -->
      <rect x="7" y="84" width="98" height="74" rx="14" fill="url(#emeraldCard)" />
      <path d="M46 122 A10 10 0 0 1 64 122 A18 18 0 0 1 36 126" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <text x="16" y="144" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Spiral Drawing</text>
    </g>

    <!-- Bold Headline (Mirrors user reference: "Book Latest Events Realtime") -->
    <text x="0" y="2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#111827">Early Screening</text>
    <text x="0" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#E53E3E">Realtime ML</text>
    <text x="0" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#6B7280">Multi-modal AI detection for tremors,</text>
    <text x="0" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#6B7280">vocal biomarkers &amp; motor stability.</text>

    <!-- Pagination Dots -->
    <circle cx="-8" cy="80" r="3" fill="#E53E3E" />
    <circle cx="0" cy="80" r="2" fill="#D1D5DB" />
    <circle cx="8" cy="80" r="2" fill="#D1D5DB" />

    <!-- Big Action Pill Button (Red/Coral like reference) -->
    <g transform="translate(0, 112)">
      <rect x="-95" y="0" width="190" height="38" rx="19" fill="url(#coralBtn)" />
      <text x="0" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Start Assessment</text>
    </g>

    <!-- Home Indicator -->
    <rect x="-45" y="256" width="90" height="4" rx="2" fill="#9CA3AF" />

    <!-- Glass Reflection Highlight -->
    <path d="M-130 -272 L20 -272 L-130 180 Z" fill="url(#glassGloss)" opacity="0.4" pointer-events="none" />
  </g>

  <!-- ==================== RIGHT PHONE (Tilted +6 deg) ==================== -->
  <g transform="translate(740, 410) rotate(6)">
    <!-- Ambient Shadow -->
    <rect x="-142" y="-285" width="284" height="570" rx="46" fill="#000000" filter="url(#phoneShadow)" />

    <!-- Outer Titanium Chassis -->
    <rect x="-140" y="-282" width="280" height="564" rx="44" fill="url(#titaniumFrame)" stroke="#535B54" stroke-width="2" />

    <!-- Screen Bezel -->
    <rect x="-132" y="-274" width="264" height="548" rx="36" fill="#0A0D0B" />

    <!-- Screen Content -->
    <rect x="-130" y="-272" width="260" height="544" rx="34" fill="#FFFFFF" />

    <!-- Top Status Bar -->
    <text x="-95" y="-246" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1A1C1A">9:41</text>
    <!-- Dynamic Island -->
    <rect x="-42" y="-260" width="84" height="22" rx="11" fill="#000000" />
    <circle cx="24" cy="-249" r="4" fill="#1C1E24" />

    <!-- App Header -->
    <text x="-105" y="-216" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A">DIAGNOSTIC REPORT</text>
    <rect x="52" y="-228" width="54" height="16" rx="8" fill="#DEF7EC" />
    <text x="79" y="-216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#03543F">AI VERIFIED</text>

    <!-- Score Card Circle Gauge -->
    <g transform="translate(0, -145)">
      <rect x="-105" y="0" width="210" height="110" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <!-- Dial -->
      <circle cx="-50" cy="55" r="34" fill="none" stroke="#E2E8F0" stroke-width="7" />
      <circle cx="-50" cy="55" r="34" fill="none" stroke="#10B981" stroke-width="7" stroke-dasharray="213" stroke-dashoffset="30" stroke-linecap="round" transform="rotate(-90 -50 55)" />
      <text x="-50" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0F172A">94<tspan font-size="9">%</tspan></text>
      <text x="-50" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#64748B">ACCURACY</text>

      <!-- Details -->
      <text x="0" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1E293B">Low Motor Risk</text>
      <text x="0" y="54" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#10B981">● Gait Stability Normal</text>
      <text x="0" y="68" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F59E0B">● Minor Tremor Variance</text>
      <text x="0" y="82" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#10B981">● Vocal Jitter 0.42%</text>
    </g>

    <!-- Vocal Acoustic Waveform Card -->
    <g transform="translate(0, -18)">
      <rect x="-105" y="0" width="210" height="66" rx="14" fill="#0F172A" />
      <text x="-93" y="18" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#94A3B8" letter-spacing="1">AUDIO FEATURE EXTRACTION</text>
      <!-- Wave bars -->
      <path d="M-90 42 Q-75 22 -60 42 T-30 42 T0 20 T30 42 T60 30 T90 42" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
      <text x="-93" y="56" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#64748B">FastAPI REST Backend • MFCC Spectrogram</text>
    </g>

    <!-- GPT-4o Mini Assistant Card -->
    <g transform="translate(0, 62)">
      <rect x="-105" y="0" width="210" height="62" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <circle cx="-85" cy="22" r="10" fill="#3B82F6" />
      <text x="-85" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">AI</text>
      <text x="-68" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#1E3A8A">GPT-4o Mini Guide</text>
      <text x="-93" y="40" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#3B82F6">"Your spiral stability is well within</text>
      <text x="-93" y="52" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#3B82F6">healthy baseline thresholds."</text>
    </g>

    <!-- Bottom Action Button -->
    <g transform="translate(0, 142)">
      <rect x="-95" y="0" width="190" height="38" rx="19" fill="#0F172A" />
      <text x="0" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Download Full Report</text>
    </g>

    <!-- Home Indicator -->
    <rect x="-45" y="256" width="90" height="4" rx="2" fill="#9CA3AF" />

    <!-- Glass Reflection Highlight -->
    <path d="M-130 -272 L40 -272 L-130 200 Z" fill="url(#glassGloss)" opacity="0.3" pointer-events="none" />
  </g>
</svg>
