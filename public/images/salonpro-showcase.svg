            <circle cx="16" cy="16" r="8" fill="#10B981" />
            <text x="16" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF">S</text>
            <text x="30" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Sofia Chen</text>
