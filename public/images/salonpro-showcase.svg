            <g transform="translate(0, 40)">
              <rect x="0" y="0" width="132" height="70" rx="8" fill="#1E3A8A" stroke="#2563EB" stroke-width="1" />
              <text x="8" y="18" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#BFDBFE">10:30 - 12:00 PM</text>
              <text x="8" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">Full Highlights</text>
              <text x="8" y="48" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#93C5FD">Client: Sarah K.</text>
