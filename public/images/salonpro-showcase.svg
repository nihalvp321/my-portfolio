            <circle cx="16" cy="16" r="8" fill="#3B82F6" />
            <text x="16" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF">M</text>
            <text x="30" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Marcus King</text>
