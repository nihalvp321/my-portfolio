            <text x="8" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">$6,480.00</text>
            <text x="8" y="52" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#94A3B8">38 Invoices • $180 Avg Ticket</text>
            <text x="8" y="64" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#10B981">Supabase Realtime Synced</text>
